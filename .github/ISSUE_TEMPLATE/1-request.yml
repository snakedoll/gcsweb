name: 요청·피드백
description: 기능 요청, 화면 수정, 기획·디자인 피드백을 남겨 주세요. 개발자가 아니어도 됩니다.
labels: ["요청"]
body:
  - type: markdown
    attributes:
      value: |
        남겨 주시면 담당 개발자가 정해지고, 진행 상황이 이 이슈에 댓글로 올라옵니다.
        공개 저장소라 누구나 볼 수 있습니다. 비밀번호나 고객 개인정보(이름·전화번호·주소)는 적지 마세요.
  - type: dropdown
    id: screen
    attributes:
      label: 어느 화면인가요?
      options:
        - QRshop (방문객 주문·결제)
        - 판매관리 (상점·상품)
        - 현장 포스
        - 전체 주문 조회
        - 데이터 관리 (매출·상품 분석)
        - 직원 권한
        - 쇼핑몰 (Shop)
        - 아카이브
        - 로그인·회원가입
        - 관리자
        - 기타
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 필요한가요?
      description: 바라는 점과 그 이유를 적어 주세요.
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Figma·노션 링크
      description: 관련 디자인이나 회의록이 있으면 붙여 주세요.
  - type: textarea
    id: images
    attributes:
      label: 스크린샷
      description: 이미지를 이 칸에 끌어다 놓으면 첨부됩니다.
  - type: dropdown
    id: urgency
    attributes:
      label: 언제까지 필요한가요?
      options:
        - 다음 회의 전까지
        - 이번 주 안
        - 여유 있음
    validations:
      required: true
